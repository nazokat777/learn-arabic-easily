name: Deploy to Vercel

# Har `main` branchga push bo'lganda Flutter web quriladi va Vercel'ga yuklanadi.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # qo'lda ham ishga tushirish mumkin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release

      - name: Install Vercel CLI
        # Mahalliy sinovda ishlagan aniq versiyaga qadaymiz (latest CI'da qotib qoldi).
        run: npm install -g vercel@56.3.2

      - name: Deploy to Vercel (production)
        working-directory: app/build/web
        # --archive=tgz: fayllarni tgz arxiv qilib yuklaydi (CI'da tez).
        # < /dev/null: interaktiv so'rovlar bo'lsa ham qotib qolmasin.
        run: vercel deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN" < /dev/null
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
