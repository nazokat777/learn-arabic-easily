name: learn_arabic
description: "Arab tilini oson o'rganamiz — o'zbeklar uchun gamifikatsiyalangan arab tili ilovasi."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.0
  audioplayers: ^6.7.1
  http: ^1.2.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/letters.json
    - assets/content/harakat.json
    - assets/content/vocabulary.json
    - assets/content/qiroat_lessons.json
    - assets/content/nahv_lessons.json
    - assets/content/version.json
    # Ovoz RO'YXATLARI ilova ichida (jami ~1 MB), ovoz FAYLLARI esa saytdan
    # olinadi (257 MB - APK ichiga sig'maydi). Fayllarni GitHub Actions
    # build/web/audio ga nusxalaydi, ilova esa VocabAudio.baseUrl orqali
    # o'sha manzildan yuklaydi.
    - assets/audio/vocab_manifest.json
    - assets/audio/sentence_manifest.json
    - assets/audio/word_manifest.json
    - assets/audio/alifbo_manifest.json
    - assets/audio/extra_manifest.json
  fonts:
    # Amiri ilova ichida. Avval google_fonts orqali internetdan olinardi:
    # shrift kelguncha (yoki internet bo'lmasa) matn zaxira shriftda
    # chiziladi, u esa harakatlarni harfga ulay olmaydi - harakatlar
    # so'z ustida ajralib suzib turadi. Endi shrift har doim tayyor.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
