<!DOCTYPE html>
<html lang="uz">
<head>
  <!--
    Base href — `flutter build web --base-href` qiymati bilan almashtiriladi
    (GitHub Pages'da /learn-arabic-easily/).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Arab tilini oson o'rganamiz — alifbo, qiroat, nahv va sarf: shaxsiy muallim kabi mashqlar bilan.">
  <meta name="theme-color" content="#07332B">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arab tili">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Arab tilini oson o'rganamiz</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Yuklanish sahnasi. Flutter web (CanvasKit) birinchi ochilishda 3–5 s
    yuklanadi — bu vaqtda bo'sh oq ekran o'rniga ilovaning o'z pardasi:
    to'q zumrad fon, nafas oluvchi oltin halqa, harf va nom. Birinchi kadr
    chizilgach (`flutter-first-frame`) parda erib yo'qoladi va ilovaning
    o'z ochilish sahnasi davom ettiradi.
  -->
  <style>
    html, body { height: 100%; margin: 0; background: #07332B; }
    #parda {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 20%, #0A5C4B 0%, #07332B 60%, #05251F 100%);
      color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .55s ease; opacity: 1;
    }
    #parda.ketdi { opacity: 0; pointer-events: none; }
    .halqa {
      width: 128px; height: 128px; border-radius: 50%;
      border: 4px solid rgba(212,165,55,.35);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      animation: nafas 1.8s ease-in-out infinite;
    }
    .halqa::before {
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 4px solid transparent; border-top-color: #D4A537;
      animation: aylan 1.4s linear infinite;
    }
    .harf { font-size: 64px; line-height: 1; color: #F2D27A; font-weight: 700;
            font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", serif; }
    .nom { margin-top: 26px; font-size: 19px; font-weight: 800; letter-spacing: -.2px; }
    .izoh { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.6); }
    @keyframes aylan { to { transform: rotate(360deg); } }
    @keyframes nafas {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212,165,55,.0); }
      50% { box-shadow: 0 0 34px 6px rgba(212,165,55,.25); }
    }
  </style>
</head>
<body>
  <div id="parda">
    <div class="halqa"><div class="harf">ع</div></div>
    <div class="nom">Arab tilini oson o'rganamiz</div>
    <div class="izoh" id="parda-izoh">Yuklanmoqda…</div>
    <div class="izoh" id="parda-sekin" style="display:none;max-width:280px;line-height:1.4">Internet sekin — birinchi ochilish uzoqroq, keyingi safar tez ochiladi.</div>
    <button id="parda-qayta" style="display:none;margin-top:14px;padding:10px 18px;border:0;border-radius:12px;background:#D4A537;color:#0B1A17;font-weight:800;font-size:14px;cursor:pointer">Qayta yuklash</button>
  </div>
  <script>
    // Flutter birinchi kadrni chizgach parda eriydi; ehtiyot uchun 20 s dan
    // keyin ham olib tashlanadi (hodisa kelmasa ilova qulflanib qolmasin).
    (function () {
      var p = document.getElementById('parda');
      var tayyor = false;
      // Bosqich matni: flutter_bootstrap.js shu funksiyani chaqiradi —
      // foydalanuvchi «nima bo'layotganini» ko'radi (yuklanish → dvigatel → darslar).
      window.pardaHolat = function (matn) {
        var e = document.getElementById('parda-izoh');
        if (e) e.textContent = matn;
      };
      function ket() {
        tayyor = true;
        if (!p) return;
        p.classList.add('ketdi');
        setTimeout(function(){ p && p.remove(); p = null; }, 600);
      }
      window.addEventListener('flutter-first-frame', ket);
      // 8 s dan keyin sekin internet ishorasi — chiqib ketmasin.
      setTimeout(function () {
        if (tayyor) return;
        var s = document.getElementById('parda-sekin');
        if (s) s.style.display = 'block';
      }, 8000);
      // 40 s dan keyin ham kadr yo'q — bo'sh oq ekran o'rniga aniq xabar
      // va qayta yuklash tugmasi.
      setTimeout(function () {
        if (tayyor) return;
        window.pardaHolat('Yuklanmadi. Internetni tekshirib, qayta urinib ko\'ring.');
        var b = document.getElementById('parda-qayta');
        if (b) { b.style.display = 'inline-block'; b.onclick = function () { location.reload(); }; }
      }, 40000);
    })();
  </script>
  <script>
    // XATO OYNASI: telefondagi (APK) WebView'da konsol ko'rinmaydi, shuning
    // uchun xatolar ekranning pastida chiqariladi — suratga olib yuborish uchun.
    (function () {
      var qator = [];
      function chiqar(m) {
        m = String(m || '').slice(0, 600);
        if (!m) return;
        qator.push(m);
        var d = document.getElementById('xato-oyna');
        if (!d) {
          d = document.createElement('div');
          d.id = 'xato-oyna';
          d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;z-index:99999;background:#300;color:#fff;font:11px/1.35 monospace;padding:8px 10px;white-space:pre-wrap;word-break:break-word';
          d.onclick = function () { d.style.display = d.style.display === 'none' ? 'block' : 'none'; };
          document.body.appendChild(d);
        }
        d.textContent = 'Xato (suratga olib yuboring):\n' + navigator.userAgent + '\n\n' + qator.slice(-8).join('\n---\n');
      }
      window.addEventListener('error', function (e) { chiqar('JS: ' + (e.message || e) + ' @' + (e.filename || '') + ':' + (e.lineno || '')); });
      window.addEventListener('unhandledrejection', function (e) { chiqar('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      // TASHXIS (vaqtinchalik): 5 s ichida telefon holatini o'lchab chiqaradi.
      (function () {
        var raf = 0, t0 = Date.now(), ff = -1;
        function tick() { raf++; if (Date.now() - t0 < 5000) requestAnimationFrame(tick); }
        requestAnimationFrame(tick);
        window.addEventListener('flutter-first-frame', function () { ff = Date.now() - t0; });
        function gl(n) { try { var c = document.createElement('canvas'); return !!c.getContext(n); } catch (e) { return false; } }
        // Shrift manbalari ochiladimi (gstatic — Google shriftlari; asset — sayt).
        function sina(nom, u) {
          var t = Date.now();
          fetch(u, { mode: 'no-cors', cache: 'no-store' })
            .then(function (r) { chiqar('DIAG: ' + nom + ' OK ' + (Date.now() - t) + 'ms status=' + r.status + ' type=' + r.type); })
            .catch(function (e) { chiqar('DIAG: ' + nom + ' XATO ' + (Date.now() - t) + 'ms ' + e); });
        }
        sina('gstatic-font', 'https://fonts.gstatic.com/s/nunito/v32/XRXI3I6Li01BKofiOc5wtlZ2di8HDLshRTM.ttf');
        sina('asset-font', 'assets/assets/fonts/Amiri-Regular.ttf');
        setTimeout(function () {
          chiqar('DIAG: rAF/5s=' + raf + ' firstFrame=' + ff + 'ms vis=' + document.visibilityState +
            ' focus=' + document.hasFocus() + ' webgl1=' + gl('webgl') + ' webgl2=' + gl('webgl2') +
            ' segmenter=' + (typeof Intl !== 'undefined' && !!Intl.Segmenter) +
            ' wasm=' + (typeof WebAssembly !== 'undefined') + ' ' + window.innerWidth + 'x' + window.innerHeight +
            ' dpr=' + window.devicePixelRatio + ' glass=' + document.querySelectorAll('flt-glass-pane,flutter-view').length);
        }, 5200);
      })();
      var ol = console.log, oe = console.error;
      console.log = function () { var m = Array.prototype.join.call(arguments, ' '); if (m.indexOf('XATO:') === 0 || m.indexOf('DIAG:') === 0) chiqar(m); return ol.apply(console, arguments); };
      console.error = function () { chiqar('console.error: ' + Array.prototype.join.call(arguments, ' ')); return oe.apply(console, arguments); };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
